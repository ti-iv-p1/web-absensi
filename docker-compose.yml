version: '3.8'

services:
  web-absensi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-absensi
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - APP_URL=${APP_URL}
    volumes:
      - ./data:/app/data
      - ./absensi-ibbi.db:/app/absensi-ibbi.db
    restart: unless-stopped
